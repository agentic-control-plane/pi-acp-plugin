name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test on .ts files needs unflagged type stripping
          # (stable from Node 22.18 / 24).
          node-version: "24"
      - run: npm install
      - run: npm test
      - run: node --test test/conformance.test.ts
